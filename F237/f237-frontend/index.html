<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon F237 (fichiers dans public/) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Couleur de la barre du navigateur sur mobile (vert F237) -->
    <meta name="theme-color" content="#16261e" />
    <meta name="description" content="F237 : scores en direct, classements et actualités de la MTN Elite One et Elite Two." />

    <!-- Polices (un seul appel à Google Fonts) :
         - Outfit              : tout le texte du site (police variable, graisses 300 à 900)
         - Barlow Condensed    : les chiffres (scores, points, classement)
         - Permanent Marker    : les grands titres -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..900&family=Barlow+Condensed:wght@700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet" />

    <title>F237 - Football Camerounais</title>

    <!-- Écran de démarrage : affiché AVANT que React soit chargé (CSS pur, aucune bibliothèque).
         Il disparaît en fondu dès que l'application s'affiche dans #root (voir le script en bas). -->
    <style>
      html, body { margin: 0; background: #16261e; }
      #ecran-demarrage {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background:
          repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.025) 0 2px, transparent 2px 34px),
          radial-gradient(circle at 50% 42%, #1f3329 0%, #16261e 55%, #111e18 100%);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #ecran-demarrage.cache { opacity: 0; visibility: hidden; }
      #ecran-demarrage .logo {
        height: 46px; width: auto; user-select: none; /* taille réelle du fichier (89×46) : net, pas flou */
        animation: f237-pulse 1.6s ease-in-out infinite;
      }
      /* Barre aux couleurs du Cameroun (vert, rouge, jaune) qui défile sous le logo */
      #ecran-demarrage .barre {
        position: relative; width: 132px; height: 4px; border-radius: 4px; overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      #ecran-demarrage .barre::after {
        content: ""; position: absolute; top: 0; bottom: 0; left: -45%; width: 45%; border-radius: 4px;
        background: linear-gradient(90deg, #1f9d55 0 33%, #e1252b 33% 66%, #fcd116 66% 100%);
        animation: f237-barre 1.1s ease-in-out infinite;
      }
      #ecran-demarrage .texte {
        font-family: "Outfit", "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 700;
        letter-spacing: 2px; text-transform: uppercase; color: rgba(255, 255, 255, 0.55);
      }
      @keyframes f237-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }
      @keyframes f237-barre {
        0% { left: -45%; }
        100% { left: 100%; }
      }
      /* Accessibilité : pas de mouvement si l'utilisateur l'a désactivé dans son système */
      @media (prefers-reduced-motion: reduce) {
        #ecran-demarrage .logo, #ecran-demarrage .barre::after { animation: none; }
        #ecran-demarrage .barre::after { left: 0; width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- Écran de démarrage (le logo doit être dans public/logo-f237.png) -->
    <div id="ecran-demarrage" role="status" aria-live="polite">
      <img class="logo" src="/logo-f237.png" alt="F237" draggable="false" />
      <div class="barre"></div>
      <div class="texte">Le pouls du Football camerounais</div>
    </div>

    <div id="root"></div>

    <script>
      // Masque l'écran de démarrage dès que React a affiché quelque chose dans #root,
      // puis le retire de la page après le fondu. Filet de sécurité : 8 s au maximum.
      (function () {
        var ecran = document.getElementById('ecran-demarrage');
        var root = document.getElementById('root');
        if (!ecran || !root) return;
        var fini = false;
        function masquer() {
          if (fini) return;
          fini = true;
          ecran.classList.add('cache');
          setTimeout(function () { if (ecran.parentNode) ecran.parentNode.removeChild(ecran); }, 400);
        }
        new MutationObserver(function (_, obs) {
          if (root.childElementCount > 0) { obs.disconnect(); masquer(); }
        }).observe(root, { childList: true });
        setTimeout(masquer, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
